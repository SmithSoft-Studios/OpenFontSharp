name: Release

# Publishes the OpenFontSharp NuGet package when a version tag is pushed
# (git tag v1.2.3 && git push origin v1.2.3); see docs/RELEASING.md. Nothing is published unless the tag matches the
# <Version> in src/OpenFontSharp/OpenFontSharp.csproj, the tests pass and the package works in a clean project. The
# publish job uses the "release" environment, which accepts only v* tags.
# NuGet uses trusted publishing: nuget.org trusts this workflow and hands it a key that lasts about an hour, so no
# long-lived key is stored. Secret: NUGET_USER (the nuget.org user name). A NUGET_API_KEY secret, if set, is used
# instead. --skip-duplicate makes a release that failed halfway safe to re-run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/OpenFontSharp/OpenFontSharp.csproj)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME and OpenFontSharp.csproj $version must match"
            exit 1
          fi

      - name: Tests
        run: dotnet test SmithSoftStudios.OpenFontSharp.sln --configuration Release

      - name: Pack, then install and run the package in a clean project
        run: bash .github/scripts/check-packages.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  nuget:
    name: Publish to NuGet
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: nuget.org exchanges the workflow's identity for a one-hour key
    env:
      NUGET_API_KEY_SECRET: ${{ secrets.NUGET_API_KEY }} # optional: an API key instead of trusted publishing
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: NuGet login (trusted publishing)
        if: env.NUGET_API_KEY_SECRET == ''
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        # Also pushes the symbols package (.snupkg) next to it; --skip-duplicate makes a re-run safe.
        run: dotnet nuget push "dist/OpenFontSharp*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub release
    needs: nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" $flags --generate-notes --title "${GITHUB_REF_NAME}"
