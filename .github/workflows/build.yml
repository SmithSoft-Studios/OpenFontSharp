name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SmithSoftStudios.OpenFontSharp.sln
      - run: dotnet build SmithSoftStudios.OpenFontSharp.sln --no-restore -c Release
      - run: dotnet test SmithSoftStudios.OpenFontSharp.sln --no-build -c Release
